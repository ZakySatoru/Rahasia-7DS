<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu Makanan</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#141e30,#243b55);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:900px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    animation:muncul 1s ease;
}

@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#243b55;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:25px;
}

table th{
    background:#243b55;
    color:white;
    padding:14px;
}

table td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

table tr:hover{
    background:#f2f2f2;
    transition:0.3s;
}

.form-box{
    background:#f7f7f7;
    padding:20px;
    border-radius:15px;
}

.input-group{
    margin-bottom:15px;
}

input,
select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#243b55;
    color:white;
    font-size:16px;
    transition:0.3s;
}

input:focus,
select:focus{
    outline:none;
    background:#355c7d;
    box-shadow:0 0 10px #00bfff;
}

input::placeholder{
    color:#cfcfcf;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#00b09b,#96c93d);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.03);
}

.hasil{
    margin-top:25px;
    background:#243b55;
    color:white;
    padding:20px;
    border-radius:15px;
    line-height:2;
    animation:muncul 0.8s ease;
    display:none;
}

.total{
    font-size:24px;
    color:#ffe600;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

    <h1>🍜 Daftar Menu Makanan 🍜</h1>

    <table>
        <tr>
            <th>No</th>
            <th>Menu</th>
            <th>Harga</th>
        </tr>

        <tbody id="dataMenu"></tbody>

    </table>

    <div class="form-box">

        <div class="input-group">
            <input type="number" id="menu" placeholder="Masukkan nomor menu..." required>
        </div>

        <div class="input-group">
            <input type="number" id="banyak" placeholder="Jumlah beli..." required>
        </div>

        <div class="input-group">
            <select id="pembayaran" required>
                <option value="">-- Pilih Pembayaran --</option>
                <option value="QRIS">QRIS</option>
                <option value="DANA">DANA</option>
                <option value="OVO">OVO</option>
            </select>
        </div>

        <button onclick="hitungTotal()">
            Pilih Menu
        </button>

    </div>

    <div class="hasil" id="hasil">

        <h2>🧾 Detail Pesanan</h2>

        <p id="menuDipilih"></p>

        <p id="hargaSatuan"></p>

        <p id="jumlahBeli"></p>

        <p id="metodeBayar"></p>

        <p class="total" id="totalBayar"></p>

    </div>

</div>

<script>

let makan = [
    'Nasi Goreng',
    'Mie Goreng',
    'Sate Ayam',
    'Soto Ayam',
    'Bakso',
    'Nasi Uduk'
];

let harga = [
    15000,
    12000,
    20000,
    18000,
    17000,
    16000
];

let dataMenu = document.getElementById("dataMenu");

for(let i = 0; i < makan.length; i++){

    dataMenu.innerHTML += `
        <tr>
            <td>${i}</td>
            <td>${makan[i]}</td>
            <td>Rp. ${harga[i].toLocaleString('id-ID')}</td>
        </tr>
    `;
}

function hitungTotal(){

    let menu = document.getElementById("menu").value;
    let banyak = document.getElementById("banyak").value;
    let pembayaran = document.getElementById("pembayaran").value;

    if(menu === "" || banyak === "" || pembayaran === ""){
        alert("Lengkapi data terlebih dahulu!");
        return;
    }

    if(menu < 0 || menu >= makan.length){
        alert("Nomor menu tidak tersedia!");
        return;
    }

    let total = harga[menu] * banyak;

    document.getElementById("hasil").style.display = "block";

    document.getElementById("menuDipilih").innerHTML =
        "Menu Dipilih : " + makan[menu];

    document.getElementById("hargaSatuan").innerHTML =
        "Harga Satuan : Rp. " + harga[menu].toLocaleString('id-ID');

    document.getElementById("jumlahBeli").innerHTML =
        "Jumlah Beli : " + banyak;

    document.getElementById("metodeBayar").innerHTML =
        "Pembayaran : " + pembayaran;

    document.getElementById("totalBayar").innerHTML =
        "Total Bayar : Rp. " + total.toLocaleString('id-ID');
}

</script>

</body>
</html>
